<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Znhaas BLE H5 Demo</title>
  <style>
    :root {
      --bg: #eef3f7;
      --card: #ffffff;
      --ink: #172333;
      --muted: #667587;
      --line: #dbe5ee;
      --brand: #1768e8;
      --brand-2: #0f9f8f;
      --danger: #d9534f;
      --log-bg: #101720;
      --log-text: #b8f3c8;
      --shadow: 0 18px 42px rgba(31, 49, 71, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(23, 104, 232, 0.18), transparent 30%),
        linear-gradient(160deg, #f7fbff 0%, var(--bg) 50%, #e8f7f4 100%);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      padding: 22px 16px 32px;
    }

    .hero {
      margin-bottom: 18px;
    }

    .eyebrow {
      color: var(--brand-2);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0 8px;
      font-size: 30px;
      line-height: 1.08;
      letter-spacing: -0.04em;
    }
    a { color: var(--brand); text-decoration: none; font-weight: 800; }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(219, 229, 238, 0.9);
      border-radius: 22px;
      box-shadow: var(--shadow);
      margin: 14px 0;
      padding: 16px;
      backdrop-filter: blur(16px);
    }

    .card-title {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-title h2 {
      font-size: 18px;
      margin: 0;
    }

    .pill {
      border-radius: 999px;
      background: #edf7ff;
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
    }

    .grid {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .field-stack {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    .field-row {
      display: grid;
      gap: 10px;
      grid-template-columns: 0.78fr 1.22fr;
    }

    .field {
      background: #f8fbff;
      border: 1px solid var(--line);
      border-radius: 16px;
      display: grid;
      gap: 7px;
      padding: 11px 12px;
    }

    .field span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field input {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      outline: none;
      padding: 0;
    }

    .field input::placeholder {
      color: #9aa9b8;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 15px;
      background: var(--brand);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      min-height: 46px;
      padding: 11px 12px;
      box-shadow: 0 8px 18px rgba(23, 104, 232, 0.22);
    }

    button.secondary {
      background: #eaf2ff;
      color: var(--brand);
      box-shadow: none;
    }

    button.green {
      background: var(--brand-2);
      box-shadow: 0 8px 18px rgba(15, 159, 143, 0.2);
    }

    button.danger {
      background: #fff0f0;
      color: var(--danger);
      box-shadow: none;
    }

    .status {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
    }

    .status-item {
      background: #f6f9fc;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
    }

    .status-item span {
      color: var(--muted);
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .status-item strong {
      font-size: 14px;
    }

    .device-list {
      display: grid;
      gap: 10px;
      min-height: 96px;
    }

    .empty {
      align-items: center;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      display: flex;
      justify-content: center;
      min-height: 96px;
      text-align: center;
    }

    .device {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f8fbff;
      padding: 13px;
    }

    .device strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .device small {
      color: var(--muted);
      display: block;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-all;
    }

    .log {
      background: var(--log-bg);
      border-radius: 18px;
      color: var(--log-text);
      font-family: "Menlo", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.5;
      max-height: 270px;
      min-height: 210px;
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 390px) {
      body {
        padding: 16px 12px 28px;
      }

      h1 {
        font-size: 26px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .field-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <a href="znhaas_app_tests.html">返回测试入口</a>
  <section class="hero">
    <h1>H5 控制蓝牙安全帽</h1>
    <p class="subtitle">页面通过 Android WebView JSBridge 调用原生 BLE SDK，支持扫描、连接、录像控制和 ACK 监听。</p>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>状态</h2>
      <span class="pill" id="bridgeState">Bridge checking</span>
    </div>
    <div class="status">
      <div class="status-item"><span>蓝牙</span><strong id="bluetoothStatus">-</strong></div>
      <div class="status-item"><span>权限</span><strong id="permissionStatus">-</strong></div>
      <div class="status-item"><span>扫描</span><strong id="scanStatus">-</strong></div>
      <div class="status-item"><span>连接</span><strong id="connectStatus">-</strong></div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>操作</h2>
      <span class="pill">znhaas only</span>
    </div>
    <div class="grid">
      <button onclick="requestPermissions()">申请权限</button>
      <button class="secondary" onclick="enableBluetooth()">开启蓝牙</button>
      <button class="green" onclick="startScan()">开始扫描</button>
      <button class="secondary" onclick="stopScan()">停止扫描</button>
      <button class="danger" onclick="disconnect()">断开连接</button>
      <button class="secondary" onclick="refreshState()">刷新状态</button>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>设备列表</h2>
      <span class="pill" id="deviceCount">0 台</span>
    </div>
    <div class="device-list" id="devices">
      <div class="empty">点击开始扫描，发现 znhaas_23070401 这类设备后点卡片连接</div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>录像控制</h2>
      <span class="pill">V1|RECORD</span>
    </div>
    <div class="field-stack">
      <div class="field-row">
        <label class="field">
          <span>扩展字段名 1</span>
          <input id="extraKey1" type="text" inputmode="text" autocomplete="off" value="work_order"
            placeholder="work_order">
        </label>
        <label class="field">
          <span>扩展字段值 1</span>
          <input id="extraValue1" type="text" inputmode="text" autocomplete="off" placeholder="WO-20250122">
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span>扩展字段名 2</span>
          <input id="extraKey2" type="text" inputmode="text" autocomplete="off" value="task_id" placeholder="task_id">
        </label>
        <label class="field">
          <span>扩展字段值 2</span>
          <input id="extraValue2" type="text" inputmode="text" autocomplete="off" placeholder="TASK-01">
        </label>
      </div>
    </div>
    <div class="grid">
      <button onclick="callCommand('startRecord')">开始录制</button>
      <button onclick="callCommand('stopRecord')">停止录制</button>
      <button onclick="callCommand('queryRecordStatus')">查询状态</button>
      <button onclick="callCommand('disableVideoKey')">禁用视频键</button>
      <button onclick="callCommand('enableVideoKey')">启用视频键</button>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>Runtime Log</h2>
      <button class="secondary" onclick="clearLog()">清空</button>
    </div>
    <div class="log" id="log"></div>
  </section>

  <script>
    const state = {
      devices: new Map(),
      bridgeReady: false,
    };

    const directBridgeMethods = [
      'getState',
      'getRequiredPermissions',
      'requestPermissions',
      'requestEnableBluetooth',
      'startScan',
      'stopScan',
      'connect',
      'disconnect',
      'writeCommand',
    ];

    const recordCommandMethods = [
      'startRecord',
      'stopRecord',
      'queryRecordStatus',
      'disableVideoKey',
      'enableVideoKey',
    ];

    window.ZnhaasBle = {
      __dispatch(payload) {
        const event = typeof payload === 'string' ? JSON.parse(payload) : payload;
        window.dispatchEvent(new CustomEvent('ZnhaasBleEvent', { detail: event }));
        if (typeof window.ZnhaasBle.onNativeEvent === 'function') {
          window.ZnhaasBle.onNativeEvent(event);
        }
      },
      onNativeEvent(event) {
        handleNativeEvent(event);
      }
    };

    function bridge() {
      installBridgeFacade();
      return window.__ZnhaasBleBridgeFacade || window.ZnhaasBleBridge;
    }

    function nativeBridge() {
      return window.__ZnhaasBleNativeBridge
        || (window.ZnhaasBleBridge && !window.ZnhaasBleBridge.__isZnhaasFacade ? window.ZnhaasBleBridge : null);
    }

    function installBridgeFacade() {
      const native = nativeBridge();
      if (!native || window.__ZnhaasBleBridgeFacade) {
        return;
      }
      const facade = {};
      directBridgeMethods.forEach(method => {
        facade[method] = (...args) => native[method](...args);
      });
      recordCommandMethods.forEach(method => {
        facade[method] = extraFields => {
          const json = stringifyExtraFields(extraFields);
          if (!json) {
            return native[method]();
          }
          return native[method + 'Json'](json);
        };
      });
      Object.defineProperty(facade, '__isZnhaasFacade', { value: true });
      window.__ZnhaasBleBridgeFacade = facade;
      try {
        window.ZnhaasBleBridge = facade;
      } catch (error) {
        // Some WebView versions keep the injected object read-only; the demo still uses the facade fallback.
      }
    }

    function stringifyExtraFields(extraFields) {
      if (!extraFields) {
        return '';
      }
      if (typeof extraFields === 'string') {
        return extraFields.trim();
      }
      if (typeof extraFields !== 'object') {
        return '';
      }
      const entries = Object.entries(extraFields).filter(([key, value]) => String(key).trim() && String(value ?? '').trim());
      if (!entries.length) {
        return '';
      }
      return JSON.stringify(Object.fromEntries(entries));
    }

    function ensureBridge() {
      if (!bridge()) {
        log('JSBridge not ready. 请确认在 Android WebView 中打开。');
        return false;
      }
      return true;
    }

    function requestPermissions() {
      if (!ensureBridge()) return;
      bridge().requestPermissions();
      log('已发起 BLE 权限申请，等待 permissionsResult 回调...');
    }

    function enableBluetooth() {
      if (!ensureBridge()) return;
      const handled = bridge().requestEnableBluetooth();
      if (!handled) {
        log('开启蓝牙请求未直接拉起，可能需要先完成 BLE 权限授权，请等待回调。');
      } else {
        log('已发起开启蓝牙请求，等待 enableBluetoothResult 回调...');
      }
    }

    function startScan() {
      if (!ensureBridge()) return;
      state.devices.clear();
      renderDevices();
      bridge().startScan(12000);
    }

    function stopScan() {
      if (!ensureBridge()) return;
      bridge().stopScan();
    }

    function disconnect() {
      if (!ensureBridge()) return;
      bridge().disconnect();
    }

    function refreshState() {
      if (!ensureBridge()) return;
      const data = JSON.parse(bridge().getState());
      updateState(data);
      log('State: ' + JSON.stringify(data));
    }

    function connect(address) {
      if (!ensureBridge()) return;
      bridge().connect(address);
    }

    function callCommand(method) {
      if (!ensureBridge()) return;
      const extras = getCommandExtras();
      const requestId = bridge()[method](extras);
      log(method + ' dispatched, requestId=' + requestId + formatCommandExtras(extras));
    }

    function getCommandExtras() {
      const extras = {};
      collectExtraField(extras, 'extraKey1', 'extraValue1');
      collectExtraField(extras, 'extraKey2', 'extraValue2');
      return extras;
    }

    function collectExtraField(extras, keyId, valueId) {
      const key = getInputValue(keyId);
      const value = getInputValue(valueId);
      if (key && value) {
        extras[key] = value;
      }
    }

    function getInputValue(id) {
      const input = document.getElementById(id);
      return input ? input.value.trim() : '';
    }

    function formatCommandExtras(extras) {
      const parts = Object.entries(extras).map(([key, value]) => key + '=' + value);
      return parts.length ? ', ' + parts.join(', ') : '';
    }

    function handleNativeEvent(event) {
      const type = event.type;
      const data = event.data || {};
      if (type === 'state' || type === 'bluetoothStateChanged' || type === 'permissionsResult' || type === 'enableBluetoothResult') {
        // log(type + ' ' + JSON.stringify(data));
        updateState(data);
      }
      if (type === 'permissionsResult') {
        log('权限申请结果: ' + (data.success ? '成功' : '失败') + '，granted=' + !!data.granted + (data.message ? '，' + data.message : ''));
      }
      if (type === 'enableBluetoothResult') {
        log('开启蓝牙结果: ' + (data.success ? '成功' : '失败') + '，enabled=' + !!data.enabled + (data.message ? '，' + data.message : ''));
      }
      if (type === 'scanStarted') {
        setText('scanStatus', '扫描中');
        log('Scan started');
      }
      if (type === 'deviceFound' && data.device) {
        state.devices.set(data.device.address, data.device);
        renderDevices();
        log('Found: ' + data.device.displayName + ' / ' + data.device.address);
      }
      if (type === 'scanStopped') {
        setText('scanStatus', '已停止');
        log('Scan stopped, count=' + (data.count || 0));
      }
      if (type === 'deviceConnecting') {
        setText('connectStatus', '连接中');
        log('Connecting: ' + formatDevice(data.device));
      }
      if (type === 'deviceConnected') {
        setText('connectStatus', '已连接');
        log('Connected: ' + formatDevice(data.device));
      }
      if (type === 'deviceReady') {
        setText('connectStatus', '就绪');
        log('Device ready: ' + formatDevice(data.device));
      }
      if (type === 'deviceDisconnected') {
        setText('connectStatus', '未连接');
        log('Disconnected');
      }
      if (type === 'servicesDiscovered') {
        log('Services discovered. Waiting reply listener...');
      }
      if (type === 'replyListenerEnabled') {
        log('Reply listener enabled: ' + data.characteristicUuid);
      }
      if (type === 'writeSuccess') {
        log('Write success: ' + data.value);
      }
      if (type === 'deviceAck') {
        log('Device ACK: ' + data.value);
      }
      if (type === 'deviceReply') {
        const prefix = data.isReadFallback ? 'Read fallback value (not ACK): ' : 'Device reply: ';
        log(prefix + data.value);
      }
      if (type === 'error' || type === 'connectionError' || type === 'writeError' || type === 'replyChannelError') {
        log('Error [' + type + ']: ' + (data.message || JSON.stringify(data)));
      }
      if (type === 'commandDispatched') {
        log('Command dispatched: ' + data.action + ', requestId=' + data.requestId + ', command=' + data.command);
      }
      if (type === 'log') {
        log(data.message || '');
      }
    }

    function updateState(data) {
      setText('bluetoothStatus', data.bluetoothEnabled ? '已开启' : '未开启');
      setText('permissionStatus', data.hasRequiredPermissions ? '已授权' : '未授权');
      setText('scanStatus', data.scanning ? '扫描中' : '已停止');
      setText('connectStatus', data.connected ? '已连接' : '未连接');
    }

    function renderDevices() {
      const root = document.getElementById('devices');
      const list = Array.from(state.devices.values());
      setText('deviceCount', list.length + ' 台');
      if (!list.length) {
        root.innerHTML = '<div class="empty">点击开始扫描，发现 znhaas_******* 这类设备后点卡片连接</div>';
        return;
      }
      root.innerHTML = list.map(device => `
        <div class="device" data-address="${escapeHtml(device.address || '')}" onclick="connect(this.dataset.address)">
          <strong>${escapeHtml(device.displayName || device.name || 'Unknown')}</strong>
          <small>${escapeHtml(device.name || '')} | ${escapeHtml(device.address || '')}</small>
          <small>RSSI: ${device.rssi} dBm | Bond: ${device.bondState}</small>
        </div>
      `).join('');
    }

    function formatDevice(device) {
      if (!device) return '-';
      return (device.displayName || device.name || '-') + ' / ' + (device.address || '-');
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function log(message) {
      const root = document.getElementById('log');
      const now = new Date();
      const time = now.toTimeString().slice(0, 8);
      root.textContent += `[${time}] ${message}\n`;
      root.scrollTop = root.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').textContent = '';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      state.bridgeReady = !!bridge();
      setText('bridgeState', state.bridgeReady ? 'Bridge ready' : 'Browser preview');
      log('H5 demo ready. Waiting JSBridge...');
      if (state.bridgeReady) {
        refreshState();
      }
    });
  </script>
</body>

</html>
